<nav class="topnav{% if page.url == '/' %} is-home{% endif %}" aria-label="Site">
  <a class="topnav-name" href="{{ '/#top' | relative_url }}">{{ site.title }}</a>
  <div class="topnav-links">
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}" data-section="{{ item.url | remove: '/#' }}">{{ item.title }}</a>{% endfor %}
  </div>
</nav>
