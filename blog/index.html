---
layout: page
title: Blog
---
{% if site.posts.size > 0 %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <p class="meta">{{ post.date | date: "%-d %B %Y" }}</p>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="meta">Nothing here yet.</p>
{% endif %}
